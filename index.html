<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DavTeam Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #070B14;
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');

  header {
    width: 100%;
    padding: 16px 20px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(0,212,255,0.15);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: #00D4FF; box-shadow: 0 0 8px #00D4FF; }
  header h1 { color: #00D4FF; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
  header span { color: #ffffff40; font-size: 11px; margin-left: auto; }

  #chat {
    flex: 1;
    width: 100%;
    max-width: 800px;
    padding: 20px 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

  .msg.user { align-self: flex-end; }
  .msg.agent { align-self: flex-start; }

  .bubble {
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .user .bubble {
    background: rgba(0,212,255,0.12);
    border: 1px solid rgba(0,212,255,0.3);
    color: #e0f7ff;
    border-bottom-right-radius: 2px;
  }

  .agent .bubble {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: #c8d6e5;
    border-bottom-left-radius: 2px;
  }

  .label {
    font-size: 10px;
    color: #ffffff30;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }

  .user .label { text-align: right; color: #00D4FF50; }

  .typing { display: flex; gap: 4px; padding: 14px 16px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #00D4FF;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity:0.2; } 40% { opacity:1; } }

  #input-area {
    width: 100%;
    max-width: 800px;
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    background: rgba(255,255,255,0.02);
    border-top: 1px solid rgba(0,212,255,0.1);
  }

  #input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 8px;
    padding: 12px 14px;
    color: #e0f7ff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    resize: none;
    max-height: 120px;
    transition: border-color 0.2s;
  }

  #input:focus { border-color: rgba(0,212,255,0.5); }
  #input::placeholder { color: #ffffff25; }

  #send {
    background: rgba(0,212,255,0.15);
    border: 1px solid rgba(0,212,255,0.4);
    border-radius: 8px;
    color: #00D4FF;
    padding: 12px 18px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    align-self: flex-end;
  }

  #send:hover { background: rgba(0,212,255,0.25); }
  #send:disabled { opacity: 0.3; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>DavTeam Agent</h1>
  <span>gemini-2.0-pro · online</span>
</header>

<div id="chat">
  <div class="msg agent">
    <div class="label">DAVTEAM</div>
    <div class="bubble">DavTeam Agent online. Built by David. How can I help?</div>
  </div>
</div>

<div id="input-area">
  <textarea id="input" rows="1" placeholder="Ask anything..."></textarea>
  <button id="send">➤</button>
</div>

<script>
const API = "https://hermes-agent-eight-omega.vercel.app/chat";
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
let history = [];

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="label">${role === "user" ? "YOU" : "DAVTEAM"}</div>
    <div class="bubble">${text.replace(/</g,"&lt;")}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "msg agent";
  div.id = "typing";
  div.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMsg() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  send.disabled = true;
  addMsg("user", text);
  showTyping();

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, history})
    });
    const data = await res.json();
    document.getElementById("typing")?.remove();

    if (data.reply) {
      history = data.history || history;
      addMsg("agent", data.reply);
    } else {
      addMsg("agent", "Error: " + (data.error || "Unknown"));
    }
  } catch(e) {
    document.getElementById("typing")?.remove();
    addMsg("agent", "Connection error: " + e.message);
  }
  send.disabled = false;
  input.focus();
}

send.addEventListener("click", sendMsg);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
</script>
</body>
</html>
